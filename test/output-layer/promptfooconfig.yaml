description: "Output layer evaluation: ethics engine explanation to natural language"

providers:
  - id: groq:meta-llama/llama-4-scout-17b-16e-instruct
    config:
      temperature: 0.0

defaultTest:
  options:
    provider: groq:meta-llama/llama-4-scout-17b-16e-instruct
    
prompts:
  - file://chat_prompt.json

tests:
  - description: "Organ harvesting dilemma"
    vars:
      situation_json: file://../../data/situation.json
      explanation_json: file://../../data/evaluation.json
    assert:
      - type: llm-rubric
        value: "The response must clearly state that the action (harvesting the organs) is considered 'permissible' or ethically allowed according to the provided principle."
      
      - type: llm-rubric
        value: "The response must accurately translate the logical equation into plain English. It should explain that the overall utility (or net good) of saving 5 patients—even if 1 healthy patient dies—is mathematically greater than or equal to the utility of letting the 5 patients die to spare the 1 healthy patient."
      
      - type: llm-rubric
        value: "The response must be written entirely in conversational natural language. It MUST NOT contain any raw JSON, code blocks, or logical notation strings like 'GEq', 'U(', 'And(', or 'Not('."