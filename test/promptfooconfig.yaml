description: "utilitarian analyst evaluation"

providers:
  - id: groq:meta-llama/llama-4-scout-17b-16e-instruct
    config:
      temperature: 0.0

defaultTest:
  options:
    provider: groq:meta-llama/llama-4-scout-17b-16e-instruct

prompts:
  - file://chat_prompt.json

tests:
  - description: "Runaway trolley dilemma"
    vars:
      dilemma: "A runaway trolley is heading toward five workers. I can pull a lever to divert it to a track with only one worker. In either case, the trolley will kill any workers in its tracks."
      assistant_state: "I have enough information. Type ANALYSE to proceed."
      user_command: "ANALYSE"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.actions.includes("refrain");
      - type: llm-rubric
        value: "The provided json reflects the user's description of the moral dilemma."
      - type: llm-rubric
        value: "The utilities should reflect that the consequence of 5 people dying has a significantly lower (more negative) utility score than 1 person dying."