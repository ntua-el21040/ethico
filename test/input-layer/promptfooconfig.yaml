description: "Evaluation of the Utilitarianist mode of the input module"

providers:
  - id: groq:meta-llama/llama-4-scout-17b-16e-instruct
    config:
      temperature: 0.0

defaultTest:
  options:
    provider: groq:meta-llama/llama-4-scout-17b-16e-instruct

prompts:
  - file://chat_prompt.json

tests:
  - description: "Runaway trolley dilemma"
    vars:
      dilemma: "A runaway trolley is heading toward five workers. I can pull a lever to divert it to a track with only one worker. In either case, the trolley will kill any workers in its tracks."
      assistant_state: "I have enough information. Type ANALYSE to proceed."
      user_command: "ANALYSE"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.actions.includes("refrain");
      - type: llm-rubric
        value: "The provided json generally reflects the user's description of the moral dilemma."
      - type: llm-rubric
        value: "The consequences and mechanisms in the provided json reflect described or expected outcomes."
      - type: llm-rubric
        value: "The utility of each consequence is reasonable in relation to the utilities of others."
  
  - description: "Robot discloses to doctor dilemma"
    vars:
      dilemma: "I'm programming a medical assistant robot. The robot knows a secret about a patient's lifestyle that is causing their illness, but the patient asked the robot to keep it a secret. The doctor is struggling to diagnose the patient and asks the robot if it knows anything. If the robot discloses the secret, the doctor can help the patient get healthy, but it breaks confidentiality. Analyze this moral dilemma."
      assistant_state: "I have enough information. Type ANALYSE to proceed."
      user_command: "ANALYSE"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.actions.includes("refrain");
      - type: llm-rubric
        value: "The provided json reflects the user's description of the moral dilemma."
      - type: llm-rubric
        value: "The consequences and mechanisms in the provided json reflect described or expected outcomes."
      - type: llm-rubric
        value: "The utility of each consequence is reasonable in relation to the utilities of others."

  - description: "Robot discloses to burglar dilemma"
    vars:
      dilemma: "Imagine a home security robot that knows the location of the family safe. A burglar breaks in and demands to know where the safe is. If the robot discloses the location, the family gets robbed. If it refrains, the safe remains secure. Analyze this moral dilemma."
      assistant_state: "I have enough information. Type ANALYSE to proceed."
      user_command: "ANALYSE"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.actions.includes("refrain");
      - type: llm-rubric
        value: "The provided json reflects the user's description of the moral dilemma."
      - type: llm-rubric
        value: "The consequences and mechanisms in the provided json reflect described or expected outcomes."
      - type: llm-rubric
        value: "The utility of each consequence is reasonable in relation to the utilities of others."

  - description: "Jim and the Indians dilemma (Bernard Williams)"
    vars:
      dilemma: "Jim finds himself in the central square of a small town. Tied up against the wall are twenty prisoners. A captain explains that they are going to be shot to deter protests. However, the captain offers Jim a guest's privilege: Jim can shoot one of the prisoners himself. If Jim accepts and kills one, the other nineteen will be let go. If Jim refuses, the captain will have his men kill all twenty. Analyze this moral dilemma."
      assistant_state: "I have enough information. Type ANALYSE to proceed."
      user_command: "ANALYSE"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.actions.includes("refrain");
      - type: llm-rubric
        value: "The provided json reflects the user's description of the moral dilemma."
      - type: llm-rubric
        value: "The consequences and mechanisms in the provided json reflect described or expected outcomes."
      - type: llm-rubric
        value: "The utility of each consequence is reasonable in relation to the utilities of others."

  - description: "Strategic bomber dilemma (Doctrine of Double Effect)"
    vars:
      dilemma: "Consider the strategic bomber dilemma. A pilot is ordered to bomb an enemy munitions factory to weaken the enemy's army and help end the war. However, there is a school right next to the factory, and bombing the factory will inevitably hit the school and kill the children inside. The pilot's goal is strictly to destroy the factory, but the civilian casualties are a foreseen side effect. Analyze this moral dilemma."
      assistant_state: "I have enough information. Type ANALYSE to proceed."
      user_command: "ANALYSE"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.actions.includes("refrain");
      - type: llm-rubric
        value: "The provided json reflects the user's description of the moral dilemma."
      - type: llm-rubric
        value: "The consequences and mechanisms in the provided json reflect described or expected outcomes."
      - type: llm-rubric
        value: "The utility of each consequence is reasonable in relation to the utilities of others."

  - description: "Terror bomber dilemma (Doctrine of Double Effect)"
    vars:
      dilemma: "Analyze the terror bomber scenario. A pilot is ordered to deliberately bomb a civilian school. The explicit goal is to kill the children in order to demoralize the enemy army, thereby weakening them and winning the war. Here, the deaths of the children are not a side effect, but the intended means to achieve the end of the war. Analyze this moral dilemma."
      assistant_state: "I have enough information. Type ANALYSE to proceed."
      user_command: "ANALYSE"
    assert:
      - type: is-json
      - type: javascript
        value: |
          const parsed = JSON.parse(output);
          return parsed.actions.includes("refrain");
      - type: llm-rubric
        value: "The provided json reflects the user's description of the moral dilemma."
      - type: llm-rubric
        value: "The consequences and mechanisms in the provided json reflect described or expected outcomes."
      - type: llm-rubric
        value: "The utility of each consequence is reasonable in relation to the utilities of others."